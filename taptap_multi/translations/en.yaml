configuration:
  log_level:
    name: Log level
    description: trace | debug | info | notice | warning | error | fatal
  mqtt_server:
    name: MQTT server
    description: IPv4 address or hostname of the MQTT broker (Mosquitto add-on = core-mosquitto or the Home Assistant IP).
  mqtt_port:
    name: MQTT port
  mqtt_qos:
    name: MQTT QoS
  mqtt_timeout:
    name: MQTT timeout
  mqtt_user:
    name: MQTT username
  mqtt_pass:
    name: MQTT password
  taptap_topic_prefix:
    name: MQTT topic prefix
    description: Topics are <prefix>/<instance name>/..., default taptap.
  taptap_update:
    name: Update interval (s)
  taptap_timeout:
    name: Node offline timeout (s)
  instances:
    name: Tigo CCA instances
    description: >-
      One entry per Tigo CCA / RS485 converter. name = HA device name and entity
      prefix (letters, digits, _ only, must be unique); address = converter IPv4
      (or serial = USB device); port = converter TCP port; modules = list of
      "STRING:NAME:SERIAL" entries (STRING and SERIAL optional, e.g. ":P01:").
  ha_discovery_prefix:
    name: HA discovery prefix
  ha_birth_topic:
    name: HA birth topic
  ha_nodes_availability_online:
    name: Node entities unavailable when node offline
  ha_nodes_availability_identified:
    name: Node entities unavailable until serial identified
  ha_strings_availability_online:
    name: String entities unavailable when no node online
  ha_strings_availability_identified:
    name: String entities unavailable until all serials identified
  ha_stats_availability_online:
    name: Total entities unavailable when no node online
  ha_stats_availability_identified:
    name: Total entities unavailable until all serials identified
  ha_nodes_sensors_recorder:
    name: Node sensors with long-term statistics
  ha_strings_sensors_recorder:
    name: String sensors with long-term statistics
  ha_stats_sensors_recorder:
    name: Total sensors with long-term statistics
